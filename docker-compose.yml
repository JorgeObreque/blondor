# Solo para desarrollo local. Producción es un cPanel sin contenedores (ver README).
services:
  app:
    build: ./docker/app
    ports:
      - "8088:80"
    volumes:
      - ./agenda:/var/www/html
    environment:
      TZ: America/Santiago
    depends_on:
      - db
      - mail

  # blondor.cl (sitio público). Misma imagen que la agenda: PHP para includes/mail.php, correos a Mailpit.
  site:
    build: ./docker/app
    ports:
      - "8087:80"
    volumes:
      - ./site:/var/www/html
    environment:
      TZ: America/Santiago
    depends_on:
      - mail

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: agenda
      MARIADB_USER: agenda
      MARIADB_PASSWORD: agenda
      MARIADB_ROOT_PASSWORD: root
      TZ: America/Santiago
    ports:
      - "3307:3306"
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql

  mail:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"

volumes:
  db_data:
